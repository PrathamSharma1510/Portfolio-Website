<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="24" fill="url(#grad1)"/>
  
  <!-- Code brackets decoration -->
  <path d="M20 40 L32 64 L20 88" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3"/>
  <path d="M108 40 L96 64 L108 88" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3"/>
  
  <!-- PS Text -->
  <text x="64" y="78" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="-2">PS</text>
  
  <!-- Small code symbol -->
  <circle cx="64" cy="95" r="2" fill="white" opacity="0.6"/>
  <circle cx="70" cy="95" r="2" fill="white" opacity="0.6"/>
  <circle cx="58" cy="95" r="2" fill="white" opacity="0.6"/>
</svg>

